# Local development database only. Production uses Neon.
services:
  db:
    image: postgres:16-alpine
    container_name: jansetu-db
    environment:
      POSTGRES_USER: jansetu
      POSTGRES_PASSWORD: jansetu
      POSTGRES_DB: jansetu
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jansetu-db-data:/var/lib/postgresql/data
volumes:
  jansetu-db-data:
